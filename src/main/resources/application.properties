spring.application.name=payment-service
server.port=8085
spring.mongodb.uri=${SPRING_MONGODB_URI}

liquibase.change-log=db/changelog/db.changelog-master.yaml

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}

app.kafka.topic=${APP_KAFKA_TOPIC}
spring.kafka.bootstrap-servers=${KAFKA_SERVERS}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true