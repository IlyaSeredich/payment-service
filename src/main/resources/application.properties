spring.application.name=payment-service
server.port=8085
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=payment_db
spring.mongodb.username=admin
spring.mongodb.password=admin
spring.mongodb.authentication-database=admin
spring.mongodb.uri=mongodb://admin:admin@localhost:27017/payment_db?authSource=admin

liquibase.change-log=db/changelog/db.changelog-master.yaml

spring.liquibase.url=mongodb://admin:admin@localhost:27017/payment_db?authSource=admin

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/app-realm/protocol/openid-connect/certs

app.kafka.topics.email-sending=PAYMENTS
spring.kafka.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true