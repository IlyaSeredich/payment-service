databaseChangeLog:
  - changeSet:
      id: create-payments-indexes
      author: Ilya Seredich
      changes:
        - createIndex:
            collectionName: payments
            keys:
              orderId: 1
            options:
              name: idx_payments_order_id

        - createIndex:
            collectionName: payments
            keys:
              userId: 1
            options:
              name: idx_payments_user_id

        - createIndex:
            collectionName: payments
            keys:
              status: 1
            options:
              name: idx_payments_status

        - createIndex:
            collectionName: payments
            keys:
              timestamp: 1
            options:
              name: idx_payments_timestamp